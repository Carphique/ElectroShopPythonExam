<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення оформлено — ElectroShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .success-icon {
            font-size: 4.5rem;
            color: #198754;
            background: #e8f5e9;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container text-center" style="max-width: 520px;">
        <div class="card border-0 shadow-lg p-5 bg-white rounded-4">
            <div class="card-body p-0">

                <div class="success-icon mb-4 shadow-sm">
                    <i class="bi bi-check-lg"></i>
                </div>

                <h2 class="fw-extrabold text-dark mb-2">Дякуємо за покупку!</h2>
                <p class="text-muted px-3">Ваше замовлення було успішно прийнято в обробку. Менеджер зв'яжеться з вами найближчим часом.</p>

                <div class="bg-light rounded-3 p-4 my-4 text-start border border-light-subtle">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Номер замовлення:</span>
                        <span class="fw-bold text-dark">#{{ order.id }}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Статус:</span>
                        <span class="badge bg-warning-subtle text-warning-emphasis rounded-pill px-3 fw-bold">Нове</span>
                    </div>
                    <hr class="text-muted opacity-25">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-dark fw-bold">Сума до сплати:</span>
                        <span class="fs-4 fw-extrabold text-danger">{{ order.total }} <small class="fs-6 fw-normal text-muted">UAH</small></span>
                    </div>
                </div>

                <a href="/" class="btn btn-primary btn-lg rounded-pill w-100 py-3 fw-semibold shadow-sm">
                    <i class="bi bi-house-door me-2"></i> Повернутися до каталогу
                </a>

            </div>
        </div>
    </div>

</body>
</html>
