<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Замовлення оформлено</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center" style="max-width: 600px;">
        <div class="alert alert-success shadow-sm" role="alert">
            <h2 class="alert-heading">Дякуємо за замовлення!</h2>
            <p class="fs-5">Ваше замовлення <strong>#{{ order.id }}</strong> успішно оформлено.</p>
            <hr>
            <p class="mb-0 fs-5">Сума до оплати: <strong>{{ order.total }}</strong>. Ми зв'яжемося з вами найближчим часом.</p>
        </div>
        <a href="/" class="btn btn-primary mt-3 px-4">Повернутися до каталогу</a>
    </div>
</body>
</html>
